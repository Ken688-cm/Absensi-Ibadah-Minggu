<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin · Absensi Ibadah USU</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body>
<header><h1>Panel Admin</h1><p>Data absensi ibadah minggu</p></header>
<main class="wide">
<section class="card" id="vLogin"><h2>Masuk admin</h2><p>Masuk dengan akun Google admin.</p><button id="bLogin">Masuk dengan Google</button><div id="err"></div></section>
<section class="hide" id="vApp">
<div class="card"><div class="row"><div><b id="who"></b></div><button class="sec" id="bOut">Keluar</button></div>
<div class="row" style="margin-top:12px">
<div><label for="fMinggu">Minggu</label><select id="fMinggu"></select></div>
<div><label for="fProdi">Program studi</label><select id="fProdi"></select></div>
<div><label for="fStambuk">Stambuk</label><select id="fStambuk"></select></div>
<div><label for="fCari">Cari nama</label><input id="fCari" type="search"></div></div>
<div class="stats" id="stats"></div>
<button id="bXls">Unduh Excel</button></div>
<div class="tw"><table><thead><tr><th>No</th><th>Waktu</th><th>Nama</th><th>Prodi</th><th>Stambuk</th><th>Email</th><th>Lokasi</th></tr></thead><tbody id="tb"></tbody></table></div>
</section></main>
<script type="module">
import{auth,login,signOut,onAuthStateChanged,db,collection,getDocs,clusterProdi,ADMIN_EMAIL,$}from"./common.js";
let rows=[],view=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("#bLogin").onclick=()=>login().catch(e=>$("#err").innerHTML=`<div class="msg err">Gagal masuk: ${e.code}</div>`);
$("#bOut").onclick=()=>signOut(auth);
const fill=(sel,vals,all)=>$(sel).innerHTML=`<option value="">${all}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join("");
onAuthStateChanged(auth,async u=>{
  const ok=u&&u.email===ADMIN_EMAIL;
  $("#vLogin").classList.toggle("hide",!!ok);$("#vApp").classList.toggle("hide",!ok);
  if(u&&!ok){$("#err").innerHTML='<div class="msg err">Akun ini bukan admin.</div>';signOut(auth);return}
  if(!ok)return;$("#who").textContent=u.email;
  try{const s=await getDocs(collection(db,"absensi"));rows=s.docs.map(d=>({...d.data(),waktuD:d.data().waktu?.toDate()}));}
  catch(e){alert("Gagal memuat data: "+e.code);return}
  fill("#fProdi",clusterProdi(rows),"Semua prodi");
  fill("#fMinggu",[...new Set(rows.map(r=>r.minggu))].sort().reverse(),"Semua minggu");
  fill("#fStambuk",[...new Set(rows.map(r=>r.stambuk))].sort(),"Semua stambuk");
  render();
});
["fMinggu","fProdi","fStambuk","fCari"].forEach(i=>$("#"+i).addEventListener("input",render));
const wib=d=>d?d.toLocaleString("id-ID",{timeZone:"Asia/Jakarta",dateStyle:"medium",timeStyle:"short"}):"-";
function render(){
  const m=$("#fMinggu").value,p=$("#fProdi").value,s=$("#fStambuk").value,q=$("#fCari").value.toLowerCase().trim();
  view=rows.filter(r=>(!m||r.minggu===m)&&(!p||r.prodiGrup===p)&&(!s||r.stambuk===s)&&(!q||r.nama.toLowerCase().includes(q))).sort((a,b)=>(b.waktuD||0)-(a.waktuD||0));
  const per={};view.forEach(r=>per[r.prodiGrup]=(per[r.prodiGrup]||0)+1);
  $("#stats").innerHTML=`<div class="stat"><b>${view.length}</b>Total hadir</div>`+Object.entries(per).map(([k,v])=>`<div class="stat"><b>${v}</b>${esc(k)}</div>`).join("");
  $("#tb").innerHTML=view.length?view.map((r,i)=>`<tr><td>${i+1}</td><td>${wib(r.waktuD)}</td><td>${esc(r.nama)}</td><td>${esc(r.prodiGrup)}</td><td>${esc(r.stambuk)}</td><td>${esc(r.email)}</td><td><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${r.lat},${r.lng}">Lihat peta</a></td></tr>`).join(""):'<tr><td colspan="7">Belum ada data untuk filter ini.</td></tr>';
}
$("#bXls").onclick=()=>{
  if(!view.length)return alert("Tidak ada data untuk diunduh.");
  const data=view.map((r,i)=>({No:i+1,Waktu:wib(r.waktuD),Minggu:r.minggu,Nama:r.nama,Prodi:r.prodiGrup,"Prodi (input asli)":r.prodi,Stambuk:r.stambuk,Email:r.email,Latitude:r.lat,Longitude:r.lng,"Akurasi (m)":r.akurasi,"Link peta":`https://www.google.com/maps?q=${r.lat},${r.lng}`}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),"Absensi");
  XLSX.writeFile(wb,`absensi-ibadah-${$("#fMinggu").value||"semua"}.xlsx`);
};
</script></body></html>
